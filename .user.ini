; Höjda gränser för uppladdning av egna ljudfiler.
; post_max_size måste vara >= upload_max_filesize (gärna lite större för
; formfält + multipart-overhead). Ett poddavsnitt är typiskt 30-100 MB.
;
; OBS: gäller PHP-FPM (Synology Web Station). .user.ini cachas i upp till
; user_ini.cache_ttl sekunder (default 300) — ändringar kan dröja ~5 min,
; eller starta om PHP-FPM-profilen i Web Station för omedelbar effekt.
upload_max_filesize = 200M
post_max_size = 210M

; Ge stora uppladdningar tid att processas (sekunder).
max_input_time = 300
